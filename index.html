<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="SocialX - تطبيق تواصل اجتماعي">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <title>SocialX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="logo">SocialX</div>
    <div class="header-actions">
      <a href="search.html" class="header-btn" aria-label="بحث">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </a>
      <a href="messages.html" class="header-btn" aria-label="رسائل">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
      </a>
    </div>
  </header>

  <section class="stories-section">
    <div class="stories-scroll" id="storiesContainer"></div>
  </section>

  <main class="feed" id="feedContainer"></main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </a>
    <a href="search.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </a>
    <a href="create.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    </a>
    <a href="notifications.html" class="nav-item" id="navNotif">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
      <span class="badge hidden" id="notifBadge">0</span>
    </a>
    <a href="profile.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </a>
  </nav>

  <div class="modal-overlay" id="postModal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-option" id="modalDelete" style="display:none">حذف المنشور</div>
      <div class="modal-option" id="modalShare">مشاركة</div>
      <div class="modal-option" id="modalCancel">إلغاء</div>
    </div>
  </div>

  <script src="firebase.js"></script>
  <script src="script.js"></script>
  <script>
    // Home Feed Logic
    document.addEventListener('DOMContentLoaded', () => {
      const user = SocialX.getCurrentUser();
      if (!user) return;

      // Stories
      const storiesEl = document.getElementById('storiesContainer');
      const users = SocialX.getUsers();
      let storiesHTML = `
        <div class="story-item" onclick="location.href='create.html'">
          <div class="story-avatar add-story"><img src="${user.avatar}" alt=""></div>
          <span class="story-username">قصتك</span>
        </div>`;
      users.filter(u => u.id !== user.id).slice(0, 8).forEach(u => {
        storiesHTML += `
          <div class="story-item" onclick="location.href='profile.html?u=${u.username}'">
            <div class="story-avatar"><img src="${u.avatar}" alt=""></div>
            <span class="story-username">${u.username}</span>
          </div>`;
      });
      storiesEl.innerHTML = storiesHTML;

      // Feed
      renderFeed();

      // Badge
      const unread = SocialX.getUnreadCount(user.id);
      const badge = document.getElementById('notifBadge');
      if (unread > 0) {
        badge.textContent = unread > 9 ? '9+' : unread;
        badge.classList.remove('hidden');
      }
    });

    function renderFeed() {
      const feed = document.getElementById('feedContainer');
      const posts = SocialX.getPosts();
      if (!posts.length) {
        feed.innerHTML = '<div class="empty-state"><h3>لا توجد منشورات بعد</h3><p>ابدأ بمتابعة أشخاص أو أنشئ منشورك الأول</p></div>';
        return;
      }
      feed.innerHTML = posts.map(post => {
        const author = SocialX.getUserById(post.userId);
        if (!author) return '';
        const liked = SocialX.isLiked(post.id);
        const saved = SocialX.isSaved(post.id);
        const caption = (post.caption || '').replace(/#(\w+)/g, '<span class="hashtag">#$1</span>');
        return `
          <article class="post-card" data-id="${post.id}">
            <div class="post-header">
              <a href="profile.html?u=${author.username}" class="post-user">
                <img class="post-avatar" src="${author.avatar}" alt="">
                <div>
                  <div class="post-username">${author.username}</div>
                  <div class="post-time">${SocialX.timeAgo(post.createdAt)}</div>
                </div>
              </a>
              <button class="post-more" onclick="openPostMenu('${post.id}')">${SocialX.icons.more}</button>
            </div>
            <div class="post-media">
              <img src="${post.image}" alt="" loading="lazy">
            </div>
            <div class="post-actions">
              <div class="post-actions-left">
                <button class="action-btn ${liked ? 'liked' : ''}" onclick="toggleLike('${post.id}', this)">
                  ${liked ? SocialX.icons.heartFilled : SocialX.icons.heart}
                </button>
                <button class="action-btn" onclick="focusComment('${post.id}')">${SocialX.icons.comment}</button>
                <button class="action-btn" onclick="sharePost('${post.id}')">${SocialX.icons.share}</button>
              </div>
              <button class="action-btn ${saved ? 'saved' : ''}" onclick="toggleSave('${post.id}', this)">
                ${saved ? SocialX.icons.bookmarkFilled : SocialX.icons.bookmark}
              </button>
            </div>
            <div class="post-likes">${SocialX.formatNumber(post.likesCount || 0)} إعجاب</div>
            <div class="post-caption"><span class="username">${author.username}</span> ${caption}</div>
            ${post.commentsCount > 0 ? `<div class="post-comments-preview" onclick="focusComment('${post.id}')">عرض ${post.commentsCount} تعليق</div>` : ''}
            <div class="post-comment-input">
              <input type="text" placeholder="أضف تعليقًا..." id="cmt-${post.id}" oninput="this.nextElementSibling.classList.toggle('active', this.value.trim())">
              <button onclick="submitComment('${post.id}')">نشر</button>
            </div>
          </article>`;
      }).join('');
    }

    function toggleLike(postId, btn) {
      const liked = SocialX.toggleLike(postId);
      btn.classList.toggle('liked', liked);
      btn.innerHTML = liked ? SocialX.icons.heartFilled : SocialX.icons.heart;
      const card = btn.closest('.post-card');
      const likesEl = card.querySelector('.post-likes');
      const post = SocialX.getPostById(postId);
      if (post) likesEl.textContent = SocialX.formatNumber(post.likesCount || 0) + ' إعجاب';
    }

    function toggleSave(postId, btn) {
      const saved = SocialX.toggleSave(postId);
      btn.classList.toggle('saved', saved);
      btn.innerHTML = saved ? SocialX.icons.bookmarkFilled : SocialX.icons.bookmark;
      SocialX.showToast(saved ? 'تم الحفظ' : 'تم إلغاء الحفظ');
    }

    function submitComment(postId) {
      const input = document.getElementById('cmt-' + postId);
      if (!input.value.trim()) return;
      SocialX.addComment(postId, input.value);
      input.value = '';
      input.nextElementSibling.classList.remove('active');
      SocialX.showToast('تم إضافة التعليق');
      renderFeed();
    }

    function focusComment(postId) {
      const input = document.getElementById('cmt-' + postId);
      if (input) input.focus();
    }

    function sharePost(postId) {
      if (navigator.share) {
        navigator.share({ title: 'SocialX', url: location.href }).catch(()=>{});
      } else {
        SocialX.showToast('تم نسخ الرابط');
      }
    }

    let currentPostId = null;
    function openPostMenu(postId) {
      currentPostId = postId;
      const post = SocialX.getPostById(postId);
      const user = SocialX.getCurrentUser();
      const delBtn = document.getElementById('modalDelete');
      delBtn.style.display = (post && post.userId === user.id) ? 'block' : 'none';
      document.getElementById('postModal').classList.add('show');
    }
    document.getElementById('modalCancel').onclick = () => document.getElementById('postModal').classList.remove('show');
    document.getElementById('modalDelete').onclick = () => {
      if (currentPostId) {
        SocialX.deletePost(currentPostId);
        document.getElementById('postModal').classList.remove('show');
        SocialX.showToast('تم حذف المنشور');
        renderFeed();
      }
    };
    document.getElementById('modalShare').onclick = () => {
      sharePost(currentPostId);
      document.getElementById('postModal').classList.remove('show');
    };
    document.getElementById('postModal').onclick = (e) => {
      if (e.target.id === 'postModal') e.target.classList.remove('show');
    };
  </script>
</body>
</html>

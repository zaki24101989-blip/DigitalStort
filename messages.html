<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>الرسائل - SocialX</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <style>
    .chat-media { max-width: 220px; border-radius: 12px; margin-top: 6px; }
    .chat-media img, .chat-media video { width: 100%; border-radius: 12px; }
    .chat-file {
      display: flex; align-items: center; gap: 10px;
      background: rgba(0,0,0,0.08); padding: 10px 14px; border-radius: 12px; margin-top: 6px;
    }
    [data-theme="dark"] .chat-file { background: rgba(255,255,255,0.1); }
    .chat-file svg { width: 28px; height: 28px; flex-shrink: 0; }
    .voice-msg {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; background: rgba(0,0,0,0.06); border-radius: 20px; margin-top: 4px;
    }
    [data-theme="dark"] .voice-msg { background: rgba(255,255,255,0.1); }
    .voice-msg button { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; }
    .attach-menu {
      position: absolute; bottom: 70px; right: 16px; left: 16px;
      background: var(--bg-secondary); border: 1px solid var(--border-color);
      border-radius: 16px; padding: 12px; display: none; z-index: 50;
      box-shadow: var(--shadow-lg);
    }
    .attach-menu.show { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
    .attach-btn {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 12px 8px; border-radius: 12px; font-size: 0.75rem; color: var(--text-primary);
    }
    .attach-btn:active { background: var(--bg-tertiary); }
    .attach-btn svg { width: 28px; height: 28px; }
    .attach-btn.photo { color: #4CAF50; }
    .attach-btn.video { color: #2196F3; }
    .attach-btn.voice { color: #E91E63; }
    .attach-btn.file { color: #FF9800; }
    .recording-indicator {
      display: none; align-items: center; gap: 8px; padding: 8px 16px;
      background: var(--like); color: white; border-radius: 20px; font-size: 0.9rem;
    }
    .recording-indicator.show { display: flex; }
    .chat-input-bar { position: relative; }
  </style>
</head>
<body>
  <div id="messagesView">
    <header class="app-header">
      <div class="logo">الرسائل</div>
      <button class="header-btn" id="newChatBtn" title="محادثة جديدة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      </button>
    </header>
    <div class="messages-list" id="conversationsList"></div>
  </div>

  <div id="chatView" class="chat-container hidden">
    <div class="chat-header">
      <button class="header-btn" id="chatBack">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <img id="chatAvatar" src="" alt="" width="36" height="36" style="border-radius:50%;object-fit:cover">
      <div style="flex:1">
        <div id="chatName" style="font-weight:600;font-size:0.95rem"></div>
        <div id="chatStatus" style="font-size:0.75rem;color:var(--text-secondary)">متصل</div>
      </div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>

    <div class="attach-menu" id="attachMenu">
      <button class="attach-btn photo" id="btnPhoto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        صورة
      </button>
      <button class="attach-btn video" id="btnVideo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        فيديو
      </button>
      <button class="attach-btn voice" id="btnVoice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        صوت
      </button>
      <button class="attach-btn file" id="btnFile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
        ملف
      </button>
    </div>

    <div class="chat-input-bar">
      <button class="header-btn" id="attachBtn" style="margin-left:4px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <input type="text" id="chatInput" placeholder="اكتب رسالة..." autocomplete="off">
      <div class="recording-indicator" id="recordingInd">
        <span>●</span> جاري التسجيل...
      </div>
      <button class="chat-send-btn" id="chatSend">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <!-- Hidden file inputs -->
  <input type="file" id="inputPhoto" accept="image/*" style="display:none">
  <input type="file" id="inputVideo" accept="video/*" style="display:none">
  <input type="file" id="inputFile" accept="*/*" style="display:none">

  <nav class="bottom-nav" id="msgNav">
    <a href="index.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></a>
    <a href="search.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></a>
    <a href="create.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></a>
    <a href="notifications.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg></a>
    <a href="profile.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
  </nav>

  <script src="firebase.js"></script>
  <script src="script.js"></script>
  <script src="messages.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>إنشاء حساب - SocialX</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">SocialX</div>
      <div class="auth-error" id="registerError"></div>
      <form class="auth-form" id="registerForm">
        <div class="form-group">
          <input type="text" id="regFullName" placeholder="الاسم الكامل" required>
        </div>
        <div class="form-group">
          <input type="text" id="regUsername" placeholder="اسم المستخدم" required pattern="[a-zA-Z0-9_]{3,20}">
        </div>
        <div class="form-group">
          <input type="email" id="regEmail" placeholder="البريد الإلكتروني" required>
        </div>
        <div class="form-group">
          <input type="password" id="regPassword" placeholder="كلمة المرور (6 أحرف على الأقل)" required minlength="6">
        </div>
        <button type="submit" class="btn-primary" id="registerBtn">إنشاء حساب</button>
      </form>
      <div class="auth-footer">
        لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
      </div>
    </div>
  </div>
  <script src="firebase.js"></script>
  <script src="script.js"></script>
  <script src="auth.js"></script>
</body>
</html>

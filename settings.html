<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>الإعدادات - SocialX</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <header class="app-header">
    <button class="header-btn" onclick="location.href='profile.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="logo">الإعدادات</div>
    <div style="width:28px"></div>
  </header>

  <div class="settings-list">
    <div class="settings-section">
      <div class="settings-item" id="editProfileBtn">
        <div class="settings-item-left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="settings-item-label">تعديل الملف الشخصي</span>
        </div>
        <span class="settings-item-right">›</span>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-item" id="darkModeToggle">
        <div class="settings-item-left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          <span class="settings-item-label">الوضع الداكن</span>
        </div>
        <div class="toggle-switch" id="themeSwitch"></div>
      </div>
      <div class="settings-item">
        <div class="settings-item-left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span class="settings-item-label">الخصوصية</span>
        </div>
        <span class="settings-item-right">›</span>
      </div>
      <div class="settings-item">
        <div class="settings-item-left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span class="settings-item-label">الإشعارات</span>
        </div>
        <span class="settings-item-right">›</span>
      </div>
      <div class="settings-item">
        <div class="settings-item-left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
          <span class="settings-item-label">اللغة</span>
        </div>
        <span class="settings-item-right">العربية</span>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-item" id="logoutBtn" style="color:var(--danger)">
        <div class="settings-item-left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span class="settings-item-label">تسجيل الخروج</span>
        </div>
      </div>
    </div>

    <p style="text-align:center;color:var(--text-muted);font-size:0.8rem;margin-top:24px">SocialX v1.0 · Demo with LocalStorage</p>
  </div>

  <!-- Edit Profile Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-sheet" style="padding:20px">
      <div class="modal-handle"></div>
      <h3 style="text-align:center;margin-bottom:16px">تعديل الملف الشخصي</h3>
      <div class="form-group" style="margin-bottom:12px">
        <input type="text" id="editFullName" placeholder="الاسم الكامل">
      </div>
      <div class="form-group" style="margin-bottom:12px">
        <textarea id="editBio" placeholder="النبذة التعريفية" rows="3" style="width:100%;padding:12px;background:var(--bg-tertiary);border-radius:8px;border:1px solid var(--border-color)"></textarea>
      </div>
      <button class="btn-primary" id="saveProfileBtn">حفظ</button>
      <button class="btn-outline" style="margin-top:8px;width:100%" id="cancelEdit">إلغاء</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="settings.js"></script>
</body>
</html>
